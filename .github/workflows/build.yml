name: Build and Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    runs-on: [self-hosted, arm64]
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
      with:
        egress-policy: audit

    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Go
      uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
      with:
        go-version: '>=1.23.0'
        cache: false

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  storage-conformance:
    runs-on: [self-hosted, arm64]
    strategy:
      fail-fast: false
      matrix:
        include:
        - backend: local
          test_regex: TestLocalBackendConformance
        - backend: http
          test_regex: TestHTTPBackendConformance
        - backend: s3
          test_regex: TestS3BackendConformance
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
      with:
        egress-policy: audit

    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Go
      uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
      with:
        go-version: '>=1.23.0'
        cache: false

    - name: Run conformance (${{ matrix.backend }})
      env:
        AWS_EC2_METADATA_DISABLED: "true"
      run: go test -v ./pkg/storage -run '${{ matrix.test_regex }}'

  integration-local:
    runs-on: [self-hosted, arm64]
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
      with:
        egress-policy: audit

    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Go
      uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
      with:
        go-version: '>=1.23.0'
        cache: false

    - name: Integration tests (local backend contract)
      env:
        STORAGE: local
      run: go test -v -tags=integration ./integration/...
